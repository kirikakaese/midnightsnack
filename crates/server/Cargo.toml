[package]
name = "midnightsnack-server"
description = "Embedded HTTP/WebSocket server of the midnightsnack host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "midnightsnack-devserver"
path = "src/bin/devserver.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
if-addrs = "0.13"
mdns-sd = "0.13"
midnightsnack-core.workspace = true
midnightsnack-protocol.workspace = true
midnightsnack-render = { path = "../render" }
midnightsnack-capture = { path = "../capture" }
bytes = "1"
mime_guess = "2"
rand = "0.9"
rust-embed = { version = "8", features = ["mime-guess"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["set-header", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
