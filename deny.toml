# cargo-deny: every dependency must be GPL-3.0-compatible.
# Exceptions are documented in THIRD_PARTY_LICENSES.md.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "LGPL-3.0-or-later",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
