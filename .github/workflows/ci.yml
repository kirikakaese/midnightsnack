name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
    libayatana-appindicator3-dev libasound2-dev xvfb

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: eslint + prettier
        run: pnpm lint
      - name: svelte-check / tsc
        run: pnpm check
      - name: i18n catalogs
        run: pnpm i18n:check
      - name: Generated protocol types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/protocol/src/generated \
            || (echo "::error::Run 'pnpm gen:types' and commit the result" && exit 1)

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs
      - name: Rust tests
        run: cargo test --workspace --locked
        env:
          MIDNIGHTSNACK_REQUIRE_PDFIUM: "1"
      - name: Frontend unit tests
        run: pnpm test
      - name: Build host (debug, no bundle)
        run: pnpm --filter @midnightsnack/host tauri build --debug --no-bundle
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-test.mjs
      - name: Smoke test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node scripts/smoke-test.mjs
