name: Release

# Push a tag like v1.2.3 (or v1.2.3-rc.1 / v1.2.3-beta.1 for a prerelease) to build a draft
# release. Publishing the draft (GitHub → Releases) makes it public and, through the `feeds`
# job, offers it to the in-app updater: stable releases to everyone, prereleases to users who
# opted into betas. See docs/dev/releasing.md.
on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  host:
    name: Host (${{ matrix.name }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            prerelease-args: --target universal-apple-darwin --bundles app,dmg
            pdfium: mac-univ
          - name: Windows x64
            os: windows-2022
            rust-targets: ""
            args: --bundles msi,nsis
            # MSI versions cannot carry "-rc.1"; prereleases ship the NSIS installer only.
            prerelease-args: --bundles nsis
            pdfium: win-x64
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles deb,appimage
            prerelease-args: --bundles deb,appimage
            pdfium: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch PDFium
        run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium }}
      - name: Check the version and the update key
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG does not match the version $cargo_version in Cargo.toml"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* || "$version" == 0.* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [ -n "$UPDATER_PUBKEY" ] && [ "$HAS_PRIVATE_KEY" = true ]; then
            echo "updater-config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "DECK_UPDATER_PUBKEY=$UPDATER_PUBKEY" >> "$GITHUB_ENV"
            echo "DECK_UPDATE_FEED=https://github.com/$GITHUB_REPOSITORY/releases/latest/download" >> "$GITHUB_ENV"
          elif [ "$prerelease" = true ]; then
            echo "::warning::No update key (variable TAURI_UPDATER_PUBKEY, secret TAURI_SIGNING_PRIVATE_KEY); this prerelease will not update itself."
          else
            echo "::error::Stable releases need the update key (see docs/dev/releasing.md)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/host
          tauriScript: pnpm tauri
          args: >-
            ${{ steps.release.outputs.prerelease == 'true' && matrix.prerelease-args || matrix.args }}
            ${{ steps.release.outputs.updater-config }}
          tagName: ${{ github.ref_name }}
          releaseName: DECK ${{ github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          includeUpdaterJson: true

  relay:
    name: Relay (${{ matrix.target }})
    if: github.event_name == 'push'
    needs: host
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web remote (served by the relay)
        run: pnpm build:remote
      - name: Build relay
        run: cargo build --release --locked -p midnightsnack-relay
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          name="deck-relay-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/deck-relay.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            gh release upload "$TAG" "$name.zip" --clobber
          else
            cp target/release/deck-relay "$name/"
            tar czf "$name.tar.gz" "$name"
            gh release upload "$TAG" "$name.tar.gz" --clobber
          fi

  relay-image:
    name: Relay Docker image
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deck-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checksums:
    name: Checksums
    if: github.event_name == 'push'
    needs: [host, relay]
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

  # Offers a published release to the in-app updater. Runs after the build (for a release that
  # is already published, e.g. created on the Releases page) and when a draft is published. The
  # app reads its feeds from the latest stable release: latest.json (stable) and beta.json (the
  # newest release, prereleases included).
  feeds:
    name: Update feeds
    needs: host
    if: always() && (github.event_name == 'release' || needs.host.result == 'success')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq '"draft=\(.isDraft)\nprerelease=\(.isPrerelease)"' >> "$GITHUB_OUTPUT"
      - name: Update the beta feed
        if: steps.state.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json; then
            echo "::warning::$TAG has no latest.json (not built yet, or built without the update key)."
            exit 0
          fi
          cp latest.json beta.json
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$stable" ]; then
            echo "::warning::No stable release yet to carry the beta feed."
            exit 0
          fi
          gh release upload "$stable" beta.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "beta.json on $stable now offers $TAG"
      # Stable releases only, like SMP: brew install --cask kirikakaese/tap/deck
      - name: Update the Homebrew tap
        if: steps.state.outputs.draft == 'false' && steps.state.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_TOKEN is not set, so the Homebrew tap was not updated (see docs/dev/releasing.md)."
            exit 0
          fi
          version="${TAG#v}"
          dmg="DECK_${version}_universal.dmg"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg"; then
            echo "::warning::$TAG has no $dmg yet; the tap is updated once it is built."
            exit 0
          fi
          sha="$(sha256sum "$dmg" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kirikakaese/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" scripts/deck.rb.template > tap/Casks/deck.rb
          cd tap
          git config user.name "kirikakaese"
          git config user.email "252577764+kirikakaese@users.noreply.github.com"
          git add Casks/deck.rb
          if git diff --cached --quiet; then
            echo "The cask is already up to date."
          else
            git commit -m "deck $version"
            git push
          fi
