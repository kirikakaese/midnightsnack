name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-22.04
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  host:
    name: Host (${{ matrix.name }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-2022
            rust-targets: ""
            args: --bundles msi,nsis
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/host
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: midnightsnack ${{ github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

  checksums:
    name: Checksums
    needs: host
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
