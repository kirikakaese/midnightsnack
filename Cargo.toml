[workspace]
resolver = "2"
members = ["crates/*", "apps/host/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/kirikakaese/midnightsnack"
authors = ["kirikakaese"]

[workspace.dependencies]
midnightsnack-core = { path = "crates/core" }
midnightsnack-protocol = { path = "crates/protocol" }
midnightsnack-control = { path = "crates/control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller debug builds: line tables keep backtraces useful; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Live capture converts and encodes every frame; unoptimized it manages only a few per second.
[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.x11rb-protocol]
opt-level = 3

[profile.dev.package.midnightsnack-capture]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
