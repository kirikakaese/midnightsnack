[package]
name = "midnightsnack-host"
description = "midnightsnack desktop host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "midnightsnack_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keepawake = "0.6"
midnightsnack-control = { workspace = true, features = ["midi-io"] }
midnightsnack-core.workspace = true
midnightsnack-protocol.workspace = true
midnightsnack-server = { path = "../../../crates/server" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
